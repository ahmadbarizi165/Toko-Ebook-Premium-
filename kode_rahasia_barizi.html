<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Toko Ebook Barizi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Daftar Pesanan Masuk</h1>
        
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="p-4">Tanggal</th>
                        <th class="p-4">Nama Pelanggan</th>
                        <th class="p-4">Email</th>
                        <th class="p-4">Ebook</th>
                        <th class="p-4">Bukti Transfer</th>
                    </tr>
                </thead>
                <tbody id="tabelPesanan">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        async function muatPesanan() {
            const respon = await fetch('/api/orders');
            const data = await respon.json();
            const tabel = document.getElementById('tabelPesanan');
            
            tabel.innerHTML = data.map(order => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-4 text-sm text-gray-600">${new Date(order.tanggal).toLocaleString('id-ID')}</td>
                    <td class="p-4 font-semibold">${order.nama}</td>
                    <td class="p-4">${order.email}</td>
                    <td class="p-4"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">${order.buku}</span></td>
                    <td class="p-4">
                        <a href="${order.buktiGambar}" target="_blank" class="text-blue-600 underline text-sm">Lihat Bukti</a>
                    </td>
                </tr>
            `).join('');
        }
        muatPesanan();
    </script>
</body>
</html>
