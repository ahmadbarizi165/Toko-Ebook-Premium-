<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Premium - Ahmad Barizi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-2xl font-bold text-blue-800 italic">E-PREMIUM</h1>
        <button onclick="window.location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-700">Login</button>
    </nav>

    <div class="max-w-4xl mx-auto p-6 text-center">
        <h2 class="text-4xl font-extrabold text-gray-900 mb-4">Seni Bisnis Digital</h2>
        <p class="text-blue-600 font-semibold mb-6 text-xl">Penulis: Ahmad Barizi</p>
        
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 mb-10">
            <p class="text-gray-600 text-lg mb-8 leading-relaxed">Panduan eksklusif membangun kerajaan bisnis dari nol menggunakan platform digital modern.</p>
            
            <div class="mb-6">
                <span class="text-gray-400 line-through text-xl">Rp 199.000</span>
                <div class="text-5xl font-black text-red-600">Rp 149.000</div>
            </div>

            <button onclick="bukaModal()" class="bg-orange-600 text-white text-2xl font-bold py-4 px-12 rounded-2xl shadow-lg hover:scale-105 transition-transform w-full md:w-auto">
                BELI SEKARANG
            </button>
        </div>
    </div>

    <div id="modalBeli" class="modal flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl relative">
            <button onclick="tutupModal()" class="absolute top-4 right-4 text-gray-400 text-2xl">&times;</button>
            <h3 class="text-2xl font-bold mb-6 text-center">Konfirmasi Pembayaran</h3>
            
            <form id="formOrder" onsubmit="kirimPesanan(event)">
                <div class="space-y-4">
                    <input type="text" id="nama" placeholder="Nama Lengkap" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="email" id="email" placeholder="Email (untuk pengiriman eBook)" required class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="buku" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Seni Bisnis Digital">Seni Bisnis Digital</option>
                        <option value="Menguak Potensi Diri Tanpa Batas">Menguak Potensi Diri Tanpa Batas</option>
                    </select>
                    <label class="block text-sm font-medium text-gray-700">Upload Bukti Transfer (Gambar):</label>
                    <input type="file" id="bukti" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700">
                </div>
                
                <button type="submit" id="btnKirim" class="w-full bg-blue-600 text-white font-bold py-3 mt-8 rounded-xl hover:bg-blue-700 transition-colors">
                    KONFIRMASI SEKARANG
                </button>
            </form>
        </div>
    </div>

    <script>
        function bukaModal() { document.getElementById('modalBeli').style.display = 'flex'; }
        function tutupModal() { document.getElementById('modalBeli').style.display = 'none'; }

        async function kirimPesanan(event) {
            event.preventDefault();
            const btn = document.getElementById('btnKirim');
            btn.innerHTML = "Sedang Mengirim...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('nama', document.getElementById('nama').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('buku', document.getElementById('buku').value);
            formData.append('image', document.getElementById('bukti').files[0]);

            try {
                // Pastikan alamat fetch ini sesuai dengan URL Vercel Anda /api/konfirmasi
                const response = await fetch('/api/konfirmasi', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('✅ Sukses! Bukti transfer telah terkirim. Mohon tunggu link eBook di email Anda.');
                    tutupModal();
                } else {
                    alert('❌ Gagal mengirim. Pastikan semua data terisi.');
                }
            } catch (error) {
                alert('❌ Error koneksi ke server.');
            } finally {
                btn.innerHTML = "KONFIRMASI SEKARANG";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
